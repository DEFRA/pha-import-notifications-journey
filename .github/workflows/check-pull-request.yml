name: Check pull request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  pr-validator:
    name: Run pull request checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            10.0

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Log in to Docker Hub
        uses: DEFRA/cdp-build-action/docker-login@main

      - name: Checkout pha-import-notifications-local
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: DEFRA/pha-import-notifications-local
          ref: main
          path: pha-import-notifications-local

      - name: Start pha-import-notifications-local
        working-directory: pha-import-notifications-local
        run: docker compose up --wait --wait-timeout 300 --quiet-pull

      - name: Run journey tests
        run: dotnet test --results-directory reports --report-html --report-html-filename index.html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: ./reports

      - name: Capture Docker Compose logs
        if: always()
        working-directory: pha-import-notifications-local
        run: docker compose logs > logs.txt

      - name: Upload Docker Compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: pha-import-notifications-local/logs.txt
